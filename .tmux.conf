# default terminal
set -g default-terminal "tmux-256color"
# Set for image.nvim
set -gq allow-passthrough on
set -as terminal-features ",*:hyperlinks"
set -g visual-activity off

# Bubble the active pane title to the outer terminal. This lets tools like
# Codex/Claude running inside tmux surface their terminal-title spinner to WezTerm.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# remap prefix key
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and -
bind '\' split-window -h
bind '|' split-window -hf
bind '-' split-window -v
bind '_' split-window -vf
unbind '"'
unbind '%'

# Plugin loading
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-processes 'ssh bundle'
# Keep enough human-readable context to identify interrupted agent sessions.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-hook-post-save-layout '~/dotfiles/scripts/tmux-agent-context append-snapshot'
set -g @resurrect-hook-post-restore-all '~/dotfiles/scripts/tmux-agent-context restore'

# Save tmux state frequently and restore the latest snapshot on server start.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Theme config
set -g @themepack 'powerline/block/gray'
set -g @theme-status-interval 60
set -g @themepack-status-left-area-middle-format "#{user}"
set -g @themepack-status-right-area-right-format "#H"
set -g @theme-status-right-length 150

# mouse scrolling
set -g mouse on
set -g @scroll-speed-num-lines-per-scroll 5

# display setting?
set-option -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Optional machine-specific extensions live outside this public repository.
source-file -q ~/.tmux.local.conf
